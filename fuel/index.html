<!doctype html>
<html lang="en" data-app="fuel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Fuel</title>
  <meta name="description" content="Calories and macros: a personal food diary.">
  <meta name="theme-color" content="#0a0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fuel">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before first paint so there is no flash. Fuel's own key: in an ordinary browser
    // the training app (one folder up) shares this storage and keeps its theme under overload.theme.
    (function () {
      try {
        var t = localStorage.getItem('fuel.theme') || 'system';
        var root = document.documentElement;
        if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
        var mq = window.matchMedia('(prefers-color-scheme: light)');
        var apply = function () { root.classList.toggle('system-light', t === 'system' && mq.matches); };
        apply(); mq.addEventListener('change', function () { t = localStorage.getItem('fuel.theme') || 'system'; apply(); });
      } catch (e) {}
    })();
  </script>
  <!-- The one rule that must work when no stylesheet arrived: the note the start-up rescue below writes. -->
  <style>#boot-note { padding: 24px 8px; line-height: 1.5; font-family: -apple-system, system-ui, sans-serif; }</style>
  <script>
    // Start-up rescue (the same idea as the training app's page, for this app's files). The first start
    // after an update can still be handled by the previous release's offline copy (sw.js), and on a weak
    // signal it can store this page without this release's files. With no signal the app would then open
    // blank. If fuel.js could not load, run the previous release's files that the phone still has (every
    // script and every stylesheet, so they match; each script only sets things up on window, so running one
    // again is safe). They run from the stored copies themselves, so nothing goes to the network and nothing
    // is stored again under the old names. The update finishes the next time there is signal. While the app
    // has not started, say so instead of showing a blank screen.
    //
    // Only an older release with the same first number is used (3.0 for a 3.1 page, never one with another
    // first number: that was written for a different page). Only a release whose install finished is used:
    // its offline copy holds the entry "installed", which sw.js writes last and which names the release, and
    // every file is taken from that one copy, found by its whole address. And only this app's own offline
    // copies count, named fuel-… (the training app's are overload-…, and its main script is overload.js, one
    // folder up). A module script (sync.js) that did load is not run a second time from the stored copy: two
    // sync modules would both sync one account.
    //
    // If the app started but one of its stylesheets or classic scripts did not arrive (the offline copy refuses a
    // file that names another release), the app runs without it, and a line at the top says so.
    (function () {
      var failed = [], final = false;
      var sheets = function () { return Array.prototype.slice.call(document.querySelectorAll('link[rel="stylesheet"]')); };
      var logged = function () { try { return !!localStorage.getItem('fuel.state.v1'); } catch (e) { return false; } };
      var say = function (still) {
        var app = document.getElementById('app');
        if (window.__overload || !app || (app.textContent.trim() && !document.getElementById('boot-note'))) return;   // the app drew itself
        if (still && final) return;   // the last word was already said: nothing more is coming
        if (!still) final = true;
        app.innerHTML = '<div id="boot-note" class="empty">'
          + (still ? 'Fuel is still starting. The signal is weak, so this can take a while.' : 'Fuel did not finish starting.')
          + (logged() ? ' Everything you logged is still on this phone.' : '')
          + (still ? '' : '<br><br>Close the app and open it again where there is signal or Wi-Fi.') + '</div>';
        // A stylesheet that is still on its way keeps the browser from drawing anything, this note included.
        // Swap each one for a copy added from here, which does not hold up drawing (it still applies when it arrives).
        if (still && document.readyState !== 'complete') sheets().forEach(function (css) {
          if (css.sheet || failed.indexOf(css.href) >= 0) return;
          var copy = css.cloneNode(); css.parentNode.insertBefore(copy, css); css.parentNode.removeChild(css);
        });
      };
      // The app is running without a stylesheet or a script of its page: a line at the top, below the phone's status
      // bar (styled here, since a stylesheet may be what is missing). It hides nothing: without the stylesheet it is
      // the first thing on the page and pushes the rest down; with it the top bar is fixed at the top, so the line is
      // fixed there instead and takes the place of the status bar's strip (--safe-top in shared/ui.css): the bar, the
      // screen, the toasts and the sheets move down by its height.
      var plain = function (looks) {
        if (document.getElementById('boot-plain') || !document.body) return;
        var n = document.createElement('div');
        n.id = 'boot-plain'; n.setAttribute('role', 'status');
        n.style.cssText = 'position:relative;z-index:1000;box-sizing:border-box;padding:10px 16px;padding-top:calc(env(safe-area-inset-top, 0px) + 10px);background:Canvas;color:CanvasText;font:15px/1.45 -apple-system,system-ui,sans-serif';
        n.textContent = 'Part of Fuel did not load, so ' + (looks ? 'it looks plain.' : 'some of it may not work.') + (logged() ? ' Everything you logged is still on this phone.' : '')
          + ' Close the app and open it again where there is signal or Wi-Fi.';
        document.body.insertBefore(n, document.body.firstChild);
        var bar = document.querySelector('.topbar'), root = document.documentElement;
        var fit = function () {
          var fixed = !!bar && getComputedStyle(bar).position === 'fixed';
          n.style.position = fixed ? 'fixed' : 'relative';
          n.style.top = n.style.left = n.style.right = fixed ? '0' : '';
          if (fixed) root.style.setProperty('--safe-top', n.offsetHeight + 'px'); else root.style.removeProperty('--safe-top');
        };
        fit(); window.addEventListener('resize', fit);
      };
      setTimeout(function () { say(true); }, 8000);   // the files may still be on their way: the app replaces this when it starts
      window.addEventListener('error', function (e) { var t = e.target; if (t && t !== window && (t.src || t.href)) failed.push(t.src || t.href); }, true);
      window.addEventListener('load', function () {
        var scripts = Array.prototype.slice.call(document.querySelectorAll('script[src]')), css = sheets();
        if (window.__overload) {   // this release started (fuel.js sets it)
          var lostCss = css.some(function (l) { return failed.indexOf(l.href) >= 0; });
          var lostJs = scripts.some(function (s) { return s.type !== 'module' && failed.indexOf(s.src) >= 0; });   // sync.js (a module) is optional
          if (lostCss || lostJs) plain(lostCss);
          return;
        }
        var rel = function (url) { var m = /[?&]v=([^&#]+)/.exec(url); return m ? m[1] : ''; };
        var swap = function (url, v) { return url.replace(/([?&]v=)[^&#]*/, '$1' + v); };
        var path = function (url) { try { var u = new URL(url, location.href); return u.origin === location.origin ? u.pathname : ''; } catch (e) { return ''; } };
        var parts = function (v) { var p = String(v).split('.'); return [parseInt(p[0], 10), parseInt(p[1] || '0', 10)]; };
        var older = function (a, b) { var x = parts(a), y = parts(b); return x[0] === y[0] && x[1] < y[1]; };   // a came before b and has the same first number
        var mainPath = path('./fuel.js');   // this app's main script, next to this page
        var main = scripts.filter(function (s) { return path(s.src) === mainPath; })[0];
        if (!main || !window.caches || failed.indexOf(main.src) < 0) return say();
        var mine = rel(main.src);
        var done = new URL('./installed', location.href).href;   // the entry a finished install writes last (sw.js)
        caches.keys().then(function (keys) {
          keys = keys.filter(function (k) { return k.indexOf('fuel-') === 0; });   // this app's offline copies (the training app's are overload-…)
          return Promise.all(keys.map(function (k) {
            return caches.open(k).then(function (c) { return c.match(done).then(function (hit) { return hit ? hit.text().then(function (v) { return { copy: c, v: v.trim() }; }) : null; }); });
          })).then(function (finished) {
            var best = null;   // the newest release whose install finished and that is older than this page's
            finished.forEach(function (f) { if (f && older(f.v, mine) && (!best || older(best.v, f.v))) best = f; });
            if (!best) return say();
            var stored = function (url, type) {   // the stored copy as a local file, or null
              return best.copy.match(url).then(function (hit) {
                return hit ? hit.arrayBuffer().then(function (b) { return URL.createObjectURL(new Blob([b], { type: type })); }) : null;   // the bytes, not the stored blob: Chrome crashes running a stored blob as a script
              });
            };
            var again = function (s) { return s.type !== 'module' || failed.indexOf(s.src) >= 0; };   // a module that loaded keeps running, alone
            return Promise.all(scripts.map(function (s) { return again(s) ? stored(swap(s.src, best.v), 'text/javascript') : null; }).concat(css.map(function (l) { return stored(swap(l.href, best.v), 'text/css'); }))).then(function (have) {
              if (!have[scripts.indexOf(main)]) return say();
              have.slice(scripts.length).forEach(function (u) { if (!u) return; var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = u; document.head.appendChild(l); });
              have.slice(0, scripts.length).forEach(function (u, i) { if (!u) return; var n = document.createElement('script'); if (scripts[i].type) n.type = scripts[i].type; n.async = false; n.src = u; document.body.appendChild(n); });
              setTimeout(say, 4000);
            });
          });
        }).catch(function () { say(); });
      });
    })();
  </script>
  <!-- shared/ui.css is the design both apps share (one folder up); fuel.css holds what only this app has.
       data-app="fuel" on <html> is what gives the shared stylesheet this app's accent. -->
  <link rel="stylesheet" href="../shared/ui.css?v=3.0">
  <link rel="stylesheet" href="./fuel.css?v=3.0">
</head>
<body>
  <!-- The mark and the tab icons are the drawings of ../shared/icons.js (mark-fuel, gauge, bars, settings), written
       out here so the frame is whole before any script runs. fuel.js sets the title: the screen's name.
       The meter is part of the top bar both apps share; only the training app ever shows it. -->
  <header class="topbar">
    <div id="topbar-meter" class="topbar-meter" hidden><span></span></div>
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M7.17 12a7.03 7.03 0 1 0 14.06 0a7.03 7.03 0 1 0 -14.06 0ZM9.84 16.66C8.95 11.2 12.45 7.34 18.59 7.34C18.77 13.34 15.09 17.3 9.84 16.66Z"/><path d="M11.67 14.84L15.26 10.99" stroke-width=".75"/><path d="M3.19 5.53v3.52a1.17 1.17 0 0 0 2.34 0V5.53M4.36 5.53V18.47" stroke-width="1.17"/></svg></span><span id="topbar-title" class="brand-title">Fuel</span></div>
      <div id="topbar-right" class="topbar-right"></div>
    </div>
  </header>

  <div id="save-warning" class="save-warning" role="alert" hidden></div>
  <main id="app" class="screen"></main>

  <nav class="tabbar">
    <button class="tab" data-screen="food"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3.5 17a8.5 8.5 0 0 1 17 0"/><path d="M12 17l4-5.5"/><path d="M12 17h.01" stroke-width="2.8"/></svg></span>Today</button>
    <button class="tab" data-screen="trends"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4.5" y="12" width="3.5" height="8" rx=".9"/><rect x="10.25" y="4" width="3.5" height="16" rx=".9"/><rect x="16" y="8.5" width="3.5" height="11.5" rx=".9"/></svg></span>Trends</button>
    <button class="tab" data-screen="settings"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h8.5M17.5 8H20M4 16h2.5M11.5 16H20"/><circle cx="15" cy="8" r="2.5"/><circle cx="9" cy="16" r="2.5"/></svg></span>Settings</button>
  </nav>

  <!-- A sheet is a dialog, named by its title (fuel.js gives the title the id sheet-heading). While it is open the
       page behind is inert, Escape closes it and focus goes back to what opened it (openSheet, closeSheet). -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="sheet-close"></div>
    <div class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-heading"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <!-- Opened by the buttons that take a file: a Fuel backup, Overload's food file, or a full Overload backup. -->
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <!-- Classic scripts, in this order: icons.js first (the scripts after it draw their icons with its icon();
       if it did not arrive they still run, without icons), and food.js takes what it needs from fuel.js while it loads.
       sync.js is a module and optional: the app runs on this phone's data without it. -->
  <script src="../shared/icons.js?v=3.0"></script>
  <script src="./backup.js?v=3.0"></script>
  <script src="./fuel.js?v=3.0"></script>
  <script src="./food.js?v=3.0"></script>
  <script type="module" src="./sync.js?v=3.0"></script>
</body>
</html>
