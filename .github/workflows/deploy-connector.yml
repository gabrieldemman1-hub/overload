# Deploys connector/ (WHOOP sync + reminders) to Cloudflare Workers.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, plus
# WHOOP_CLIENT_ID and WHOOP_CLIENT_SECRET for WHOOP. See README → WHOOP and reminders.
# Writes the connector's address to connector.json so the app finds it.
# Safety: wrangler is pinned to one exact version in connector/package.json; each step gets only
# the secrets it needs; the job that runs downloaded code can only read this repository, and the
# job that commits connector.json holds no Cloudflare or WHOOP secret.
name: Deploy connector

on:
  push:
    branches: [main]
    paths: ['connector/**', '.github/workflows/deploy-connector.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-connector

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check secrets
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Connector not deployed: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions, then run this workflow."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$WHOOP_CLIENT_ID" ] || [ -z "$WHOOP_CLIENT_SECRET" ]; then
            echo "::warning::WHOOP_CLIENT_ID / WHOOP_CLIENT_SECRET are not set: reminders will work, WHOOP sync will not."
          else
            echo "whoop=1" >> "$GITHUB_OUTPUT"
          fi

      - name: KV namespace
        if: steps.check.outputs.skip != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id=$(curl -fsS -H "$auth" "$API/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="overload-connector") | .id' | head -1)
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' -d '{"title":"overload-connector"}' "$API/storage/kv/namespaces" | jq -r .result.id)
            echo "Created KV namespace $id"
          fi
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::Could not find or create the KV namespace. Check the API token has Workers KV Storage: Edit."; exit 1; }
          sed -i "s/KV_NAMESPACE_ID/$id/" connector/wrangler.toml

      # No secrets here: the exact wrangler version comes from connector/package.json.
      - name: Install wrangler
        if: steps.check.outputs.skip != '1'
        working-directory: connector
        run: npm install --no-save --no-audit --no-fund

      - name: Deploy worker
        if: steps.check.outputs.skip != '1'
        working-directory: connector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy

      - name: WHOOP secrets
        if: steps.check.outputs.skip != '1' && steps.check.outputs.whoop == '1'
        working-directory: connector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
        run: |
          jq -n --arg id "$WHOOP_CLIENT_ID" --arg s "$WHOOP_CLIENT_SECRET" '{WHOOP_CLIENT_ID:$id, WHOOP_CLIENT_SECRET:$s}' > "$RUNNER_TEMP/secrets.json"
          npx --no-install wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: Address and health check
        if: steps.check.outputs.skip != '1'
        id: url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
          [[ "$sub" =~ ^[a-z0-9-]+$ ]] || { echo "::error::No workers.dev subdomain yet. Open Workers & Pages in the Cloudflare dashboard once to pick one, then rerun."; exit 1; }
          url="https://overload-connector.$sub.workers.dev"
          for i in $(seq 1 20); do
            if curl -fsS "$url/" -o /tmp/health.json; then cat /tmp/health.json; echo; break; fi
            sleep 5
          done
          grep -q '"ok":true' /tmp/health.json || { echo "::error::$url/ did not answer"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Connector is live"
            echo "- Address: $url"
            echo "- WHOOP redirect URL (paste into your WHOOP app): \`$url/whoop/callback\`"
            echo "- WHOOP keys set: $(jq -r .whoopReady /tmp/health.json)"
            echo "- Now open Overload → Settings → WHOOP → Connect WHOOP and type the code it shows, before anyone else can."
          } >> "$GITHUB_STEP_SUMMARY"

  # Commits connector.json. Holds a write token but no Cloudflare or WHOOP secret, and runs no downloaded code.
  publish:
    needs: deploy
    if: needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4

      - name: Tell the app where it is
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          [[ "$URL" =~ ^https://overload-connector\.[a-z0-9-]+\.workers\.dev$ ]] || { echo "::error::Unexpected connector address; connector.json not changed."; exit 1; }
          printf '{ "url": "%s" }\n' "$URL" > connector.json
          if git diff --quiet -- connector.json 2>/dev/null && git ls-files --error-unmatch connector.json >/dev/null 2>&1; then
            echo "connector.json unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add connector.json
          git commit -m "connector.json: $URL"
          git pull --rebase origin main
          git push origin HEAD:main
          # Pushes made by this workflow do not start a Pages build on their own.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null && echo "Pages rebuild requested" || echo "::warning::Could not request a Pages build; it will update on the next push."
