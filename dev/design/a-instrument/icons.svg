<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <!--
    INSTRUMENT icon set. One grid: 24 x 24, 2 px margin, 1.5 px stroke, round caps and joins, 2 px corner radius.
    Lines, circles and 45-degree angles only. Colour comes from currentColor.
    Use:  <svg class="ic"><use href="icons.svg#i-check"/></svg>   (or paste this file into index.html and use href="#i-check")
  -->
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .f { fill: currentColor; stroke: none; }
    </style>
  </defs>

  <!-- ===== Tab icons: Overload ===== -->
  <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M3 10v4M6.5 6.5v11M17.5 6.5v11M21 10v4M6.5 12h11"/></symbol>
  <symbol id="i-plan" viewBox="0 0 24 24"><rect x="3.5" y="4" width="4" height="4" rx="1"/><rect x="3.5" y="10" width="4" height="4" rx="1"/><rect x="3.5" y="16" width="4" height="4" rx="1"/><path d="M11 6h9.5M11 12h9.5M11 18h6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8.5 6h12M8.5 12h12M8.5 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-chart-line" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M8 15l3.5-4 3 2.5L20 7.5"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 8h8.5M17.5 8H20M4 16h2.5M11.5 16H20"/><circle cx="15" cy="8" r="2.5"/><circle cx="9" cy="16" r="2.5"/></symbol>

  <!-- ===== Tab icons: Fuel ===== -->
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M3.5 17a8.5 8.5 0 0 1 17 0"/><path d="M12 17l4-5.5"/><path d="M12 17h.01" stroke-width="2.5"/></symbol>
  <symbol id="i-chart-bar" viewBox="0 0 24 24"><rect x="4.5" y="12" width="3.5" height="8" rx=".75"/><rect x="10.25" y="4" width="3.5" height="16" rx=".75"/><rect x="16" y="8.5" width="3.5" height="11.5" rx=".75"/></symbol>

  <!-- ===== Actions ===== -->
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-check-bold" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-width="2.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
  <symbol id="i-chev-u" viewBox="0 0 24 24"><path d="M6 14.5l6-6 6 6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="2.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-barcode" viewBox="0 0 24 24"><path d="M3 8V5h3M21 8V5h-3M3 16v3h3M21 16v3h-3"/><path d="M7 9v6M10 9v6M12.5 9v6M17 9v6"/><path d="M14.75 9v6" stroke-width="1"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h15M16 5l3 3-3 3M20 16H5M8 13l-3 3 3 3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.9 12.5h9.2L17.5 7M10.25 10.5v5.5M13.75 10.5v5.5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20l1-4.2L16.3 4.5l3.2 3.2L8.2 19 4 20zM14 6.8l3.2 3.2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/><path d="M15.5 8.5v-2a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 5.5l-4 4 4 4M4 9.5h10.5a5 5 0 0 1 0 10H11"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5L8 5.5z"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 14V3.5M8.5 7L12 3.5 15.5 7M8 10.5H5.5V20h13v-9.5H16"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 5.5H5.5v13h13V14M14 5.5h4.5V10M18.5 5.5L11 13"/></symbol>

  <!-- ===== Data in and out ===== -->
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5a4.25 4.25 0 0 1-.6-8.46 5.5 5.5 0 0 1 10.63-1.2A4.85 4.85 0 0 1 17 18.5H7.5z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19.5h14"/></symbol>
  <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5V3.5h6V5M9 11h6M9 15h3.5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6v-17zM14 3.5v4h4"/></symbol>

  <!-- ===== Training ===== -->
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9M10 3h4M12 3v3"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 5.5H5V7a3 3 0 0 0 3 3M16 5.5h3V7a3 3 0 0 1-3 3M12 13v4M8.5 20h7M9.5 17h5"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c.6 3.2 5 5.2 5 10a5 5 0 0 1-10 0c0-1.9.8-3.4 1.9-4.5.3 1.5 1 2.4 2 2.8C10.8 8.6 11.2 5.6 12 3z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8.5-10.5h-6L13 3z"/></symbol>
  <symbol id="i-scale" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10.5a4.6 4.6 0 0 1 8 0M12 7.5l1 3"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.2A8 8 0 0 1 9.8 4.5a8 8 0 1 0 9.7 9.7z"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 12h.01" stroke-width="2"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4.5h14V15l-4.5 4.5H5v-15zM14.5 19.5V15H19M8.5 9h7M8.5 12.5h4"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>

  <!-- ===== Food ===== -->
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.7 1-5.9-4.3-4.1 5.9-.8L12 3.5z"/></symbol>
  <symbol id="i-star-fill" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.7 1-5.9-4.3-4.1 5.9-.8L12 3.5z"/></symbol>
  <symbol id="i-stack" viewBox="0 0 24 24"><path d="M12 4l8.5 4.25L12 12.5 3.5 8.25 12 4zM3.5 12.25L12 16.5l8.5-4.25M3.5 16.25L12 20.5l8.5-4.25"/></symbol>

  <!-- ===== Status ===== -->
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8h.01"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 15.5H3L12 4zM12 10v4.5M12 17h.01"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6.5 10.5L12 5l5.5 5.5"/></symbol>
  <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M6.5 13.5L12 19l5.5-5.5"/></symbol>

  <!-- ===== Brand marks: the small glyph in the top bar. The lit part takes the accent token of the app. ===== -->
  <symbol id="i-mark-overload" viewBox="0 0 24 24">
    <path d="M1.5 12h21" stroke-width="1.5" opacity=".45"/>
    <rect class="f" x="3" y="9" width="3.5" height="6" rx=".75" fill="currentColor" stroke="none"/>
    <rect class="f" x="8" y="7" width="3.5" height="10" rx=".75" fill="currentColor" stroke="none"/>
    <rect class="f" x="13" y="5" width="3.5" height="14" rx=".75" fill="currentColor" stroke="none"/>
    <rect x="18" y="3" width="3.5" height="18" rx=".75" fill="var(--accent)" stroke="none"/>
  </symbol>
  <symbol id="i-mark-fuel" viewBox="0 0 24 24">
    <path d="M3.5 17.5a8.5 8.5 0 0 1 17 0" stroke-width="3.5" stroke-linecap="butt" opacity=".35"/>
    <path d="M3.5 17.5a8.5 8.5 0 0 1 17 0" stroke-width="3.5" stroke-linecap="butt" stroke="var(--accent)" pathLength="100" stroke-dasharray="64 100"/>
    <path d="M12 17.5l3.6-4.8" stroke-width="1.75"/>
  </symbol>
</svg>
