<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <!--
    Athletic icon set. One grid, one voice.
    - 24 x 24 grid, 2 px safe margin (live area 20 x 20).
    - Filled bodies with soft corners (radius 1.2 to 4). Details are knocked out (fill-rule evenodd), 1.6 to 2 px wide.
    - Linear glyphs (plus, check, chevrons, arrows, close) are 2.5 px strokes with round caps and joins.
    - Everything paints with currentColor, so an icon takes the colour of its text.
    Use: <svg class="ic"><use href="icons.svg#i-check"/></svg>, or paste this file's content at the top of <body> and use href="#i-check".
  -->

