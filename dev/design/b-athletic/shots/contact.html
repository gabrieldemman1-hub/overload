<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Athletic · contact sheet</title>
<style>
  body { margin: 0; padding: 20px; font: 600 13px/1.2 -apple-system, system-ui, sans-serif; }
  body.dark { background: #050608; color: #b9bdc8; } body.light { background: #dfe2e8; color: #434956; }
  .row { display: flex; gap: 20px; }
  figure { margin: 0; width: 250px; flex: none; }
  img { display: block; width: 250px; height: 541px; border-radius: 26px; }
  body.dark img { box-shadow: 0 0 0 1px #262a34; } body.light img { box-shadow: 0 0 0 1px #cfd3db; }
  figcaption { padding: 10px 4px 0; text-align: center; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
  var theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark';
  document.body.className = theme;
  ['train-today', 'train-workout', 'train-feedback', 'train-history', 'train-program', 'train-settings', 'fuel-today', 'fuel-add', 'fuel-amount', 'fuel-trends', 'fuel-welcome'].forEach(function (n) {
    var f = document.createElement('figure');
    f.innerHTML = '<img src="' + n + '-' + theme + '.png" alt="' + n + '"><figcaption>' + n + '</figcaption>';
    document.getElementById('row').appendChild(f);
  });
</script>
</body>
</html>
