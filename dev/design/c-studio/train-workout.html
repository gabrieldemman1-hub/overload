<!-- Open exercise -->
<section class="card ex">
  <div class="ex-head">
    <h2 class="ex-name">Machine Chest Press</h2>
    <button class="icon-btn" aria-label="Exercise options"><svg class="i" aria-hidden="true"><use href="#i-more"/></svg></button>
  </div>
  <p class="ex-goal">3 sets × 10–12 at <b>150 lb</b> · goal <b>12 reps</b></p>
  <div class="ex-facts">
    <p class="ex-fact"><svg class="i sm" aria-hidden="true"><use href="#i-clock"/></svg><span class="num">Last time: 150 × 12, 11, 11</span></p>
    <p class="ex-fact"><svg class="i sm" aria-hidden="true"><use href="#i-edit"/></svg><span class="note">Seat 4, pin 7</span></p>
  </div>

  <div class="sets">
    <div class="set-head" aria-hidden="true"><span>Set</span><span>lb</span><span>Reps</span><span></span></div>
    <div class="set done">
      <span class="set-n">1</span>
      <label class="numfield"><input inputmode="decimal" value="150" aria-label="Set 1 weight, lb"></label>
      <label class="numfield"><input inputmode="numeric" value="12" aria-label="Set 1 reps"></label>
      <button class="tick on" aria-pressed="true" aria-label="Set 1 done"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg></button>
    </div>
    <div class="rir">
      <span class="rir-label">Reps left</span>
      <button>3+</button><button class="on" aria-pressed="true">2</button><button>1</button><button>0</button>
    </div>
    <div class="set done">
      <span class="set-n">2</span>
      <label class="numfield"><input inputmode="decimal" value="150" aria-label="Set 2 weight, lb"></label>
      <label class="numfield"><input inputmode="numeric" value="12" aria-label="Set 2 reps"></label>
      <button class="tick on" aria-pressed="true" aria-label="Set 2 done"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg></button>
    </div>
    <div class="rir">
      <span class="rir-label">Reps left</span>
      <button>3+</button><button>2</button><button class="on" aria-pressed="true">1</button><button>0</button>
    </div>
    <div class="set next">
      <span class="set-n">3</span>
      <label class="numfield"><input inputmode="decimal" value="150" aria-label="Set 3 weight, lb"></label>
      <label class="numfield"><input inputmode="numeric" placeholder="12" aria-label="Set 3 reps, goal 12"><span>goal</span></label>
      <button class="tick" aria-pressed="false" aria-label="Set 3: log 12 reps"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg></button>
    </div>
    <div class="rir idle" aria-hidden="true">
      <span class="rir-label">Reps left</span>
      <button disabled>3+</button><button disabled>2</button><button disabled>1</button><button disabled>0</button>
    </div>
  </div>

  <div class="ex-tools">
    <div class="stepper" role="group" aria-label="Sets">
      <button aria-label="Remove a set"><svg class="i sm" aria-hidden="true"><use href="#i-minus"/></svg></button>
      <span class="val">3<small>sets</small></span>
      <button aria-label="Add a set"><svg class="i sm" aria-hidden="true"><use href="#i-plus"/></svg></button>
    </div>
    <button class="btn sm"><svg class="i sm" aria-hidden="true"><use href="#i-flame"/></svg>Warm-up</button>
    <button class="btn sm"><svg class="i sm" aria-hidden="true"><use href="#i-swap"/></svg>Swap</button>
  </div>
  <button class="btn block mt-4">Finish exercise</button>
</section>
