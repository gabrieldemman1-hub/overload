<!--{"app":"fuel","tab":"today","title":"Fuel: amount","base":"fuel-today","body":"sheet-open"}-->
<!--overlay-->
<div class="backdrop"></div>
<section class="sheet" role="dialog" aria-modal="true" aria-label="Amount of Chicken breast">
  <div class="grabber"></div>
  <div class="sheet-head" style="align-items:flex-start">
    <div>
      <p class="eyebrow">Add to Dinner · Today</p>
      <h2>Chicken breast, cooked (roasted)</h2>
    </div>
    <div class="flex" style="gap:6px;margin-top:2px">
      <button class="icon-btn fill accent" aria-label="Favorite" aria-pressed="true">{{star solid}}</button>
      <button class="icon-btn fill" aria-label="Close">{{close}}</button>
    </div>
  </div>

  <label class="numfield xl mt-2"><input inputmode="decimal" value="170" aria-label="Amount"><span>g</span></label>
  <div class="seg mt-3" role="group" aria-label="Unit">
    <button class="on" aria-pressed="true">g</button><button>oz</button><button>serving (85 g)</button>
  </div>

  <div class="flex mt-6" style="gap:18px">
    <div class="ring-wrap">
      <svg class="ring" width="84" height="84" viewBox="0 0 84 84" style="--ring-w:8" role="img" aria-label="11 percent of today's 2,600 kcal"><circle class="ring-track" cx="42" cy="42" r="37" pathLength="100"/><circle class="ring-val" cx="42" cy="42" r="37" pathLength="100" stroke-dasharray="11 100"/></svg>
      <span class="ring-label">11%<small>of day</small></span>
    </div>
    <div class="grow">
      <p class="eyebrow">This adds</p>
      <p class="hero mt-1" style="font-size:44px">281<span class="unit">kcal</span></p>
      <p class="small muted mt-2 num">928 kcal left after this</p>
    </div>
  </div>

  <div class="macros mt-5">
    <div><p class="macro-label"><i class="dot protein"></i>Protein</p><p class="macro-val" style="margin-bottom:0">53<small> g</small></p></div>
    <div><p class="macro-label"><i class="dot carbs"></i>Carbs</p><p class="macro-val" style="margin-bottom:0">0<small> g</small></p></div>
    <div><p class="macro-label"><i class="dot fat"></i>Fat</p><p class="macro-val" style="margin-bottom:0">6<small> g</small></p></div>
  </div>

  <p class="field-label mt-6">Meal</p>
  <div class="seg" role="group" aria-label="Meal">
    <button>Breakfast</button><button>Lunch</button><button class="on" aria-pressed="true">Dinner</button><button>Snacks</button>
  </div>

  <div class="sheet-foot mt-3">
    <button class="btn primary lg block">Add to Dinner</button>
    <button class="btn ghost block sm mt-2">Numbers wrong? Fix them</button>
  </div>
</section>
