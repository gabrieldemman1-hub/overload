</header>

<div id="save-warning" class="save-warning" role="alert" hidden></div>
<main id="app" class="screen">
<div class="screen-title"><h1>Food</h1></div><div class="f-daynav"><button class="icon-btn" data-action="food-day" data-d="-1" aria-label="Previous day"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14.5 6l-6 6 6 6"/></svg></button><button class="f-daylabel" data-action="food-day" data-d="0">Today</button><button class="icon-btn" data-action="food-day" data-d="1" aria-label="Next day" disabled><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.5 6l6 6-6 6"/></svg></button></div><div class="card f-sum"><div class="f-kcal sr"><div><span class="f-big">1,322</span><span class="muted"> / 2,600 kcal</span></div><div class="f-left ">1,278 left</div></div>

  </svg>
  <div class="gauge-read" aria-hidden="true"><div class="label">kcal left</div><div class="gauge-num">1,278</div></div>
</div>
<div class="gauge-foot"><span aria-hidden="true"><b>1,322</b> eaten</span><button class="gauge-target" data-action="food-targets" aria-label="Target 2,600 kcal. Change targets">of <b>2,600</b><svg class="ic s" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.5 6l6 6-6 6"/></svg></button></div>
<div class="f-macros"><div class="f-macro"><div class="k">Protein</div><div class="v">133<span class="muted"> / 190 g</span></div><div class="f-bar"><span class="m" style="width:70.0%"></span></div></div><div class="f-macro"><div class="k">Carbs</div><div class="v">113<span class="muted"> / 280 g</span></div><div class="f-bar"><span class="m" style="width:40.4%"></span></div></div><div class="f-macro"><div class="k">Fat</div><div class="v">34<span class="muted"> / 80 g</span></div><div class="f-bar"><span class="m" style="width:42.5%"></span></div></div></div></div><div class="card f-meal" data-meal="0"><div class="f-meal-head"><h2>Breakfast</h2><div class="row"><span class="muted small">525 kcal</span><button class="icon-btn f-more" data-action="food-meal-menu" data-meal="0" aria-label="Breakfast options"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="2.8"/></svg></button></div></div><button class="f-row" data-action="food-edit" data-id="m00"><div class="grow"><div class="title">Kodiak Power Waffles</div><div class="sub">2 waffles (76 g) · Kodiak</div></div><div class="f-rk">190</div></button><button class="f-row" data-action="food-edit" data-id="m01"><div class="grow"><div class="title">Eggs, large</div><div class="sub">3 eggs (150 g)</div></div><div class="f-rk">215</div></button><button class="f-row" data-action="food-edit" data-id="m02"><div class="grow"><div class="title">Fairlife milk, 2%</div><div class="sub">1 cup (240 ml) · Fairlife</div></div><div class="f-rk">120</div></button><button class="btn subtle small block mt8" data-action="food-add" data-meal="0"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>Add food</button></div><div class="card f-meal" data-meal="1"><div class="f-meal-head"><h2>Lunch</h2><div class="row"><span class="muted small">775 kcal</span><button class="icon-btn f-more" data-action="food-meal-menu" data-meal="1" aria-label="Lunch options"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="2.8"/></svg></button></div></div><button class="f-row" data-action="food-edit" data-id="m10"><div class="grow"><div class="title">Chicken breast, cooked (roasted)</div><div class="sub">200 g</div></div><div class="f-rk">330</div></button><button class="f-row" data-action="food-edit" data-id="m11"><div class="grow"><div class="title">Rice, white, cooked</div><div class="sub">250 g</div></div><div class="f-rk">325</div></button><button class="f-row" data-action="food-edit" data-id="m12"><div class="grow"><div class="title">Avocado</div><div class="sub">1/2 avocado (75 g)</div></div><div class="f-rk">120</div></button><button class="btn subtle small block mt8" data-action="food-add" data-meal="1"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>Add food</button></div><div class="card f-meal" data-meal="2"><div class="f-meal-head"><h2>Dinner</h2><div class="row"><span class="muted small"></span><button class="icon-btn f-more" data-action="food-meal-menu" data-meal="2" aria-label="Dinner options"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="2.8"/></svg></butto </main>

<nav class="tabbar">
  <button class="tab active" data-screen="food"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3.5 17a8.5 8.5 0 0 1 17 0"/><path d="M12 17l4-5.5"/><path d="M12 17h.01" stroke-width="2.8"/></svg></span>Today</button>
  <button class="tab" data-screen="trends"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4.5" y="12" width="3.5" height="8" rx=".9"/><rect x="10.25" y="4" width="3.5" height="16" rx=".9"/><rect x="16" y="8.5" width="3.5" height="11.5" rx=".9"/></svg></span>Trends</button>
  <button class="tab" data-screen="settings"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h8.5M17.5 8H20M4 16h2.5M11.5 16H20"/><circle cx="15" cy="8" r="2.5"/><circle cx="9" cy="16" r="2.5"/></svg></span>Settings</button>
</nav>

<div id="sheet" class="sheet">
  <div class="sheet-backdrop" data-action="sheet-close"></div>
  <div class="sheet-panel" id="sheet-panel">
<div class="sheet-title"><h2>Scan barcode</h2><div class="row"><button class="btn subtle small" data-action="food-back"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14.5 6l-6 6 6 6"/></svg>Back</button><button class="icon-btn" data-action="sheet-close" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div><div class="f-scanview"><video id="scan-video" playsinline muted></video><div class="guide"></div></div><p id="scan-status" class="small muted center mt8">Hold the barcode inside the box.</p><div class="btn-row mt8"><label class="btn ghost small" for="scan-photo"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3.5 9.5a1.5 1.5 0 0 1 1.5-1.5h2.2l1.5-2.5h6.6L16.8 8H19a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5v-8z"/><circle cx="12" cy="13.2" r="3.4"/></svg>Scan a photo</label><button class="btn ghost small" data-action="food-type-code">Type the number</button></div><input type="file" id="scan-photo" data-field="food-photo" accept="image/*" capture="environment" hidden>
  </div>
</div>

<div id="toast" class="toast">Added to favorites</div>
</body>
</html>
