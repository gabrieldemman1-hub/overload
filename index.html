<!doctype html>
<html lang="en" data-app="overload">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Overload</title>
  <meta name="description" content="Personal hypertrophy tracker with rep-range progression.">
  <meta name="theme-color" content="#0a0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Overload">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    (function () {
      try {
        var t = localStorage.getItem('overload.theme') || 'system';
        var root = document.documentElement;
        if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
        var mq = window.matchMedia('(prefers-color-scheme: light)');
        var apply = function () { root.classList.toggle('system-light', t === 'system' && mq.matches); };
        apply(); mq.addEventListener('change', function () { t = localStorage.getItem('overload.theme') || 'system'; apply(); });
      } catch (e) {}
    })();
  </script>
  <script>
    // Start-up rescue. The first start after an update can still be handled by the previous release's
    // offline copy (sw.js), and on a weak signal it can store this page without this release's files.
    // With no signal the app would then open blank. If overload.js could not load, run the previous release's
    // files that the phone still has (every script and every stylesheet, so they match; each script only
    // sets things up on window, so running one again is safe). They run from the stored copies themselves,
    // so nothing goes to the network and nothing is stored again under the old names. The update finishes
    // the next time there is signal. While the app has not started, say so instead of showing a blank screen.
    //
    // Only an older release with the same first number is used (3.0 for a 3.1 page, never 2.8 for a 3.0
    // page): a release with another first number was written for a different page, and running it here
    // would be worse than the note. Only a release whose install finished is used: its offline copy holds the
    // entry "installed", which sw.js writes last and which names the release, and every file is taken from
    // that one copy. And only this app's own offline copies count (overload-…): the diet app in fuel/ has its
    // own files and its own. A module script (sync.js) that did load is not run a second time from the stored
    // copy: two sync modules would both sync one account.
    //
    // If the app started but one of its stylesheets or classic scripts did not arrive (the offline copy refuses a
    // file that names another release), the app runs without it, and a line at the top says so. The same when
    // backup.js or connector.js arrived from another release: overload.js does not use them (see part there).
    (function () {
      var failed = [], final = false;
      var sheets = function () { return Array.prototype.slice.call(document.querySelectorAll('link[rel="stylesheet"]')); };
      var logged = function () { try { return !!localStorage.getItem('overload.state.v1'); } catch (e) { return false; } };
      var say = function (still) {
        var app = document.getElementById('app');
        if (window.__overload || !app || (app.textContent.trim() && !document.getElementById('boot-note'))) return;   // the app drew itself
        if (still && final) return;   // the last word was already said: nothing more is coming
        if (!still) final = true;
        app.innerHTML = '<div id="boot-note" class="empty" style="padding:24px 8px;line-height:1.5;font-family:-apple-system,system-ui,sans-serif">'
          + (still ? 'Overload is still starting. The signal is weak, so this can take a while.' : 'Overload did not finish starting.')
          + (logged() ? ' Everything you logged is still on this phone.' : '')
          + (still ? '' : '<br><br>Close the app and open it again where there is signal or Wi-Fi.') + '</div>';
        // A stylesheet that is still on its way keeps the browser from drawing anything, this note included.
        // Swap each one for a copy added from here, which does not hold up drawing (it still applies when it arrives).
        if (still && document.readyState !== 'complete') sheets().forEach(function (css) {
          if (css.sheet || failed.indexOf(css.href) >= 0) return;
          var copy = css.cloneNode(); css.parentNode.insertBefore(copy, css); css.parentNode.removeChild(css);
        });
      };
      // The app is running without a stylesheet or a script of its page: a line at the top, below the phone's status
      // bar (styled here, since a stylesheet may be what is missing). It hides nothing: without the stylesheet it is
      // the first thing on the page and pushes the rest down; with it the top bar is fixed at the top, so the line is
      // fixed there instead and takes the place of the status bar's strip (--safe-top in shared/ui.css): the bar, the
      // screen, the toasts and the sheets move down by its height.
      var plain = function (looks) {
        if (document.getElementById('boot-plain') || !document.body) return;
        var n = document.createElement('div');
        n.id = 'boot-plain'; n.setAttribute('role', 'status');
        n.style.cssText = 'position:relative;z-index:1000;box-sizing:border-box;padding:10px 16px;padding-top:calc(env(safe-area-inset-top, 0px) + 10px);background:Canvas;color:CanvasText;font:15px/1.45 -apple-system,system-ui,sans-serif';
        n.textContent = 'Part of Overload did not load, so ' + (looks ? 'it looks plain.' : 'some of it may not work.') + (logged() ? ' Everything you logged is still on this phone.' : '')
          + ' Close the app and open it again where there is signal or Wi-Fi.';
        document.body.insertBefore(n, document.body.firstChild);
        var bar = document.querySelector('.topbar'), root = document.documentElement;
        var fit = function () {
          var fixed = !!bar && getComputedStyle(bar).position === 'fixed';
          n.style.position = fixed ? 'fixed' : 'relative';
          n.style.top = n.style.left = n.style.right = fixed ? '0' : '';
          if (fixed) root.style.setProperty('--safe-top', n.offsetHeight + 'px'); else root.style.removeProperty('--safe-top');
        };
        fit(); window.addEventListener('resize', fit);
      };
      setTimeout(function () { say(true); }, 8000);   // the files may still be on their way: the app replaces this when it starts
      window.addEventListener('error', function (e) { var t = e.target; if (t && t !== window && (t.src || t.href)) failed.push(t.src || t.href); }, true);
      window.addEventListener('load', function () {
        var scripts = Array.prototype.slice.call(document.querySelectorAll('script[src]')), css = sheets();
        if (window.__overload) {   // this release started (overload.js sets it)
          var lostCss = css.some(function (l) { return failed.indexOf(l.href) >= 0; });
          var lostJs = scripts.some(function (s) { return s.type !== 'module' && failed.indexOf(s.src) >= 0; });   // sync.js (a module) is optional
          // A helper file that arrived from another release (2.8's worker hands out what the server has): overload.js leaves it unused.
          var other = !!(window.__overload.otherParts && window.__overload.otherParts().length);
          if (lostCss || lostJs || other) plain(lostCss);
          return;
        }
        var rel = function (url) { var m = /[?&]v=([^&#]+)/.exec(url); return m ? m[1] : ''; };
        var swap = function (url, v) { return url.replace(/([?&]v=)[^&#]*/, '$1' + v); };
        var path = function (url) { try { var u = new URL(url, location.href); return u.origin === location.origin ? u.pathname : ''; } catch (e) { return ''; } };
        var parts = function (v) { var p = String(v).split('.'); return [parseInt(p[0], 10), parseInt(p[1] || '0', 10)]; };
        var older = function (a, b) { var x = parts(a), y = parts(b); return x[0] === y[0] && x[1] < y[1]; };   // a came before b and has the same first number
        var mainPath = path('./overload.js');   // this app's main script, next to this page
        var main = scripts.filter(function (s) { return path(s.src) === mainPath; })[0];
        if (!main || !window.caches || failed.indexOf(main.src) < 0) return say();
        var mine = rel(main.src);
        var done = new URL('./installed', location.href).href;   // the entry a finished install writes last (sw.js)
        caches.keys().then(function (keys) {
          keys = keys.filter(function (k) { return k.indexOf('overload-') === 0; });   // this app's offline copies (the diet app's are fuel-…)
          return Promise.all(keys.map(function (k) {
            return caches.open(k).then(function (c) { return c.match(done).then(function (hit) { return hit ? hit.text().then(function (v) { return { copy: c, v: v.trim() }; }) : null; }); });
          })).then(function (finished) {
            var best = null;   // the newest release whose install finished and that is older than this page's
            finished.forEach(function (f) { if (f && older(f.v, mine) && (!best || older(best.v, f.v))) best = f; });
            if (!best) return say();
            var stored = function (url, type) {   // the stored copy as a local file, or null
              return best.copy.match(url).then(function (hit) {
                return hit ? hit.arrayBuffer().then(function (b) { return URL.createObjectURL(new Blob([b], { type: type })); }) : null;   // the bytes, not the stored blob: Chrome crashes running a stored blob as a script
              });
            };
            var again = function (s) { return s.type !== 'module' || failed.indexOf(s.src) >= 0; };   // a module that loaded keeps running, alone
            return Promise.all(scripts.map(function (s) { return again(s) ? stored(swap(s.src, best.v), 'text/javascript') : null; }).concat(css.map(function (l) { return stored(swap(l.href, best.v), 'text/css'); }))).then(function (have) {
              if (!have[scripts.indexOf(main)]) return say();
              have.slice(scripts.length).forEach(function (u) { if (!u) return; var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = u; document.head.appendChild(l); });
              have.slice(0, scripts.length).forEach(function (u, i) { if (!u) return; var n = document.createElement('script'); if (scripts[i].type) n.type = scripts[i].type; n.async = false; n.src = u; document.body.appendChild(n); });
              setTimeout(say, 4000);
            });
          });
        }).catch(function () { say(); });
      });
    })();
  </script>
  <link rel="stylesheet" href="./shared/ui.css?v=3.0">
  <link rel="stylesheet" href="./train.css?v=3.0">
</head>
<body>
  <!-- The sets meter comes before .topbar-inner: the stylesheet draws it on the bar's bottom edge, and "the meter
       is showing" is what switches the bar to its workout layout. overload.js (renderTopbar) sets the title and the meter. -->
  <header class="topbar">
    <div id="topbar-meter" class="topbar-meter" hidden><span></span></div>
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><g fill="currentColor" stroke="none"><rect x="1.97" y="11.39" width="20.06" height="1.22" rx=".61"/><rect x="4.41" y="8.25" width="2.53" height="7.5" rx=".89"/><rect x="7.45" y="5.44" width="2.95" height="13.12" rx="1.03"/><rect x="13.6" y="5.44" width="2.95" height="13.12" rx="1.03"/><rect x="17.06" y="8.25" width="2.53" height="7.5" rx=".89"/></g></svg></span><span id="topbar-title" class="brand-title">Today</span></div>
      <div id="topbar-right" class="topbar-right"></div>
    </div>
  </header>

  <div id="save-warning" class="save-warning" role="alert" hidden></div>
  <main id="app" class="screen"></main>

  <div id="rest-timer" class="rest-timer" hidden>
    <div class="rest-timer-inner">
      <div>
        <div class="rest-top"><span class="rest-label">Rest</span><span id="rest-next" class="rest-next"></span></div>
        <div class="rest-clock"><span id="rest-time" class="rest-time">2:00</span><span id="rest-of" class="rest-of"></span></div>
      </div>
      <div class="rest-actions">
        <button class="btn ghost small" data-action="rest-add">+30s</button>
        <button class="btn ghost small" data-action="rest-skip">Skip</button>
      </div>
    </div>
    <div class="rest-bar"><div id="rest-bar-fill" class="rest-bar-fill"></div></div>
  </div>

  <nav class="tabbar">
    <button class="tab" data-screen="today"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 10v4M6.5 6.5v11M17.5 6.5v11M21 10v4M6.5 12h11"/></svg></span>Today</button>
    <button class="tab" data-screen="program"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>Program</button>
    <button class="tab" data-screen="exercises"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 6h11.5M9 12h11.5M9 18h11.5"/><path d="M4.25 6h.01M4.25 12h.01M4.25 18h.01" stroke-width="2.6"/></svg></span>Exercises</button>
    <button class="tab" data-screen="history"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 4v16h16"/><path d="M8 15l3.5-4 3 2.5L20 7.5"/></svg></span>History</button>
    <button class="tab" data-screen="settings"><span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h8.5M17.5 8H20M4 16h2.5M11.5 16H20"/><circle cx="15" cy="8" r="2.5"/><circle cx="9" cy="16" r="2.5"/></svg></span>Settings</button>
  </nav>

  <!-- A sheet is a dialog, named by its title (overload.js gives the title the id sheet-heading). While it is open
       the page behind is inert, Escape closes it and focus goes back to what opened it (openSheet, closeSheet). -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="sheet-close"></div>
    <div class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-heading"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <!-- The main script is overload.js and the stylesheets are shared/ui.css and train.css: names v2.8 never used.
       v2.8's stored page asks the server for ./app.js, ./styles.css and ./food.js. With nothing there, its worker
       falls back to v2.8's own stored copies, so that page never runs this release's code. Keep those three
       names free (sh bump.sh checks it). -->
  <script src="./programs.js?v=3.0"></script>
  <script src="./backup.js?v=3.0"></script>
  <script src="./shared/icons.js?v=3.0"></script>
  <script src="./overload.js?v=3.0"></script>
  <script src="./connector.js?v=3.0"></script>
  <script type="module" src="./sync.js?v=3.0"></script>
</body>
</html>
