<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Overload</title>
  <meta name="description" content="Personal hypertrophy tracker with rep-range progression.">
  <meta name="theme-color" content="#111214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Overload">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    (function () {
      try {
        var t = localStorage.getItem('overload.theme') || 'system';
        var root = document.documentElement;
        if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
        var mq = window.matchMedia('(prefers-color-scheme: light)');
        var apply = function () { root.classList.toggle('system-light', t === 'system' && mq.matches); };
        apply(); mq.addEventListener('change', function () { t = localStorage.getItem('overload.theme') || 'system'; apply(); });
      } catch (e) {}
    })();
  </script>
  <script>
    // Start-up rescue. The first start after an update can still be handled by the previous release's
    // offline copy (sw.js), and on a weak signal it can store this page without this release's files.
    // With no signal the app would then open blank. If app.js could not load, run the previous release's
    // files that the phone still has (every script and the styles, so they match; each script only sets
    // things up on window, so running one again is safe). They run from the stored copies themselves, so
    // nothing goes to the network and nothing is stored again under the old names. The update finishes
    // the next time there is signal. While the app has not started, say so instead of showing a blank screen.
    (function () {
      var failed = [], final = false;
      var say = function (still) {
        var app = document.getElementById('app');
        if (window.__overload || !app || (app.textContent.trim() && !document.getElementById('boot-note'))) return;   // the app drew itself
        if (still && final) return;   // the last word was already said: nothing more is coming
        if (!still) final = true;
        var logged = false; try { logged = !!localStorage.getItem('overload.state.v1'); } catch (e) {}
        app.innerHTML = '<div id="boot-note" class="empty" style="padding:24px 8px;line-height:1.5;font-family:-apple-system,system-ui,sans-serif">'
          + (still ? 'Overload is still starting. The signal is weak, so this can take a while.' : 'Overload did not finish starting.')
          + (logged ? ' Everything you logged is still on this phone.' : '')
          + (still ? '' : '<br><br>Close the app and open it again where there is signal or Wi-Fi.') + '</div>';
        // A stylesheet that is still on its way keeps the browser from drawing anything, this note included.
        // Swap it for a copy added from here, which does not hold up drawing (it still applies when it arrives).
        var css = document.querySelector('link[rel="stylesheet"]');
        if (still && css && !css.sheet && document.readyState !== 'complete' && failed.indexOf(css.href) < 0) {
          var copy = css.cloneNode(); css.parentNode.insertBefore(copy, css); css.parentNode.removeChild(css);
        }
      };
      setTimeout(function () { say(true); }, 8000);   // the files may still be on their way: the app replaces this when it starts
      window.addEventListener('error', function (e) { var t = e.target; if (t && t !== window && (t.src || t.href)) failed.push(t.src || t.href); }, true);
      window.addEventListener('load', function () {
        if (window.__overload) return;   // this release started (app.js sets it)
        var stored = function (url, type) {   // the stored copy as a local file, or null
          return caches.match(url).then(function (hit) { return hit ? hit.arrayBuffer().then(function (b) { return URL.createObjectURL(new Blob([b], { type: type })); }) : null; });   // the bytes, not the stored blob: Chrome crashes running a stored blob as a script
        };
        var scripts = Array.prototype.slice.call(document.querySelectorAll('script[src]'));
        var rel = function (url) { var m = /[?&]v=([^&#]+)/.exec(url); return m ? m[1] : ''; };
        var swap = function (url, v) { return url.replace(/([?&]v=)[^&#]*/, '$1' + v); };
        var main = scripts.filter(function (s) { return /\/app\.js[?&]/.test(s.src); })[0];
        if (!main || !window.caches || failed.indexOf(main.src) < 0) return say();
        var mine = rel(main.src);
        caches.keys().then(function (keys) {
          return Promise.all(keys.filter(function (k) { return k.indexOf('overload-') === 0; }).map(function (k) { return caches.open(k).then(function (c) { return c.keys(); }); }));
        }).then(function (lists) {
          var old = '';
          lists.forEach(function (reqs) { reqs.forEach(function (r) { var v = /\/app\.js[?&]/.test(r.url) ? rel(r.url) : ''; if (v && v !== mine) old = v; }); });
          if (!old) return say();
          var css = document.querySelector('link[rel="stylesheet"]');
          return Promise.all(scripts.map(function (s) { return stored(swap(s.src, old), 'text/javascript'); }).concat(css ? [stored(swap(css.href, old), 'text/css')] : [])).then(function (have) {
            var sheet = css ? have.pop() : null;
            if (sheet) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = sheet; document.head.appendChild(l); }
            have.forEach(function (u, i) { if (!u) return; var n = document.createElement('script'); if (scripts[i].type) n.type = scripts[i].type; n.async = false; n.src = u; document.body.appendChild(n); });
            setTimeout(say, 4000);
          });
        }).catch(function () { say(); });
      });
    })();
  </script>
  <link rel="stylesheet" href="./styles.css?v=2.8">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark"></span>Overload</div>
      <div id="topbar-right" class="topbar-right"></div>
    </div>
  </header>

  <div id="save-warning" class="save-warning" role="alert" hidden></div>
  <main id="app" class="screen"></main>

  <div id="rest-timer" class="rest-timer" hidden>
    <div class="rest-timer-inner">
      <div>
        <div class="rest-label">Rest</div>
        <div id="rest-time" class="rest-time">2:00</div>
      </div>
      <div class="rest-actions">
        <button class="btn ghost small" data-action="rest-add">+30s</button>
        <button class="btn small" data-action="rest-skip">Skip</button>
      </div>
    </div>
    <div class="rest-bar"><div id="rest-bar-fill" class="rest-bar-fill"></div></div>
  </div>

  <nav class="tabbar">
    <button class="tab" data-screen="today"><span class="tab-icon">▶</span>Today</button>
    <button class="tab" data-screen="food"><span class="tab-icon">◉</span>Food</button>
    <button class="tab" data-screen="program"><span class="tab-icon">☰</span>Program</button>
    <button class="tab" data-screen="exercises"><span class="tab-icon">◆</span>Exercises</button>
    <button class="tab" data-screen="history"><span class="tab-icon">▤</span>History</button>
    <button class="tab" data-screen="settings"><span class="tab-icon">⚙</span>Settings</button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="sheet-close"></div>
    <div class="sheet-panel" id="sheet-panel"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="./programs.js?v=2.8"></script>
  <script src="./backup.js?v=2.8"></script>
  <script src="./app.js?v=2.8"></script>
  <script src="./food.js?v=2.8"></script>
  <script src="./connector.js?v=2.8"></script>
  <script type="module" src="./sync.js?v=2.8"></script>
</body>
</html>
